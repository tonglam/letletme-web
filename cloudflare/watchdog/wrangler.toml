name = "edgeone-watchdog"
main = "src/index.js"
compatibility_date = "2026-08-15"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "FAILOVER_STATE"
id = "a13f5523944d4e719c8e64efb1aa5593"

[[durable_objects.bindings]]
name = "FAILOVER_COORDINATOR"
class_name = "FailoverCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "FailoverCoordinator" ]

[vars]
WATCHDOG_ENABLED = "false"
APEX_NAME = "letletme.top"
VERCEL_HEALTH_URL = "https://letletme-web.vercel.app/healthz"
EDGEONE_HEALTH_URL = "https://letletme.top/healthz"
VERCEL_FALLBACK_TTL = "1"
PROBE_TIMEOUT_MS = "8000"
DNS_API_BASE = "https://api.cloudflare.com/client/v4"
