name = "edgeone-watchdog"
main = "src/index.js"
compatibility_date = "2026-08-15"
workers_dev = false

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "FAILOVER_STATE"
id = "a13f5523944d4e719c8e64efb1aa5593"

[[durable_objects.bindings]]
name = "FAILOVER_COORDINATOR"
class_name = "FailoverCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "FailoverCoordinator" ]

[vars]
WATCHDOG_ENABLED = "false"
DNSPOD_DOMAIN = "letletme.top"
DNSPOD_EDGEONE_LINE = "境内"
DNSPOD_DEFAULT_VERCEL_LINE = "默认"
VERCEL_HEALTH_URL = "https://vercel-origin.letletme.top/healthz"
EDGEONE_HEALTH_URL = "https://eo-personal-canary.letletme.top/healthz"
PROBE_TIMEOUT_MS = "8000"
