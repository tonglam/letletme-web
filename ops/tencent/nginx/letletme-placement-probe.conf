# This file is loaded at Nginx's top level from modules-enabled after the
# ngx_stream_module load directive installed by libnginx-mod-stream.
# It intentionally exposes no HTTP, TLS, files, secrets, or application
# upstream. Cloudflare Placement Hints only need a successful TCP connection.
stream {
	server {
		listen 8443;
		listen [::]:8443;
		access_log off;
		return "letletme-placement-probe\n";
	}
}
