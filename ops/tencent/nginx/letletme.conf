server {
	listen 443 ssl default_server;
	listen [::]:443 ssl default_server;
	server_name _;

	ssl_certificate /etc/letletme/tls/origin.pem;
	ssl_certificate_key /etc/letletme/tls/origin-key.pem;
	ssl_protocols TLSv1.2 TLSv1.3;

	return 444;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name letletme.top;

	ssl_certificate /etc/letletme/tls/origin.pem;
	ssl_certificate_key /etc/letletme/tls/origin-key.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:letletme_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 8m;
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain;

	if ($letletme_origin_authorized = 0) {
		return 404;
	}

	location ^~ /_next/static/ {
		root /;
		include /etc/nginx/snippets/letletme-static-try-files.conf;
		access_log off;
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header X-Letletme-Origin "tencent" always;
		add_header X-Letletme-Release $letletme_release always;
	}

	location / {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_cache off;
		proxy_connect_timeout 3s;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;

		proxy_set_header Host letletme.top;
		proxy_set_header Connection "";
		# The public request is HTTPS, but the upstream Node listener is plain HTTP.
		# Next's self-hosted Proxy/middleware may make an internal request using
		# this value; advertising the upstream transport prevents it from sending
		# TLS to the cleartext loopback listener. The public Host remains pinned
		# below, and Cloudflare still terminates/validates the external TLS hop.
		proxy_set_header X-Forwarded-Proto http;
		proxy_set_header X-Forwarded-Host letletme.top;
		proxy_set_header X-Forwarded-Port 443;

		# Never pass browser/provider forwarding headers through to Node.
		proxy_set_header X-Forwarded-For "";
		proxy_set_header X-Real-IP "";
		proxy_set_header CF-Connecting-IP "";
		proxy_set_header X-Vercel-Forwarded-For "";
		proxy_set_header X-Vercel-ID "";
		proxy_set_header X-Letletme-Origin-Token "";
		proxy_set_header X-Letletme-Client-IP "";

		# Only these Nginx-generated headers may reach the app's trusted branch.
		proxy_set_header X-Letletme-Proxy-Client-IP $http_x_letletme_proxy_client_ip;
		proxy_set_header X-Letletme-Proxy-Secret $letletme_local_proxy_secret;

		proxy_hide_header X-Letletme-Origin;
		proxy_hide_header X-Letletme-Release;
		proxy_hide_header X-Middleware-Rewrite;
		add_header X-Letletme-Origin "tencent" always;
		add_header X-Letletme-Release $letletme_release always;
	}
}
