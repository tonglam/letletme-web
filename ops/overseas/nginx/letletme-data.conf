# Canonical overseas API/Data ingress. Explicit hostnames and default_server
# prevent another enabled site from taking api.letletme.top by include order.
# VPS Ops must install and expose the root-owned letletme_graphql_active
# upstream at Nginx http scope before this site is enabled; see ../README.md.
limit_req_zone $letletme_overseas_client_ip zone=api_limit:10m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.letletme.top pop.letletme.top _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name api.letletme.top pop.letletme.top _;

    client_max_body_size 8m;

    ssl_certificate     /etc/letsencrypt/live/api.letletme.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.letletme.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options 'DENY' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-XSS-Protection '1; mode=block' always;

    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /telegramBot/letletme/notification {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8026/telegramBot/letletme/notification;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /wechatBot/letletme/notification {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8027/wechatBot/letletme/notification;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /wechatBot/letletme/admin {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8027;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /graphql {
        # The Live Points V2 hard cut must never leave the retired blue
        # GraphQL runtime reachable through the historical public path. Both
        # Web /api/graphql preserves the signed proxy boundary and uses this
        # same canonical selector URL as its production upstream. V1 operations
        # then fail at the V2 contract gate instead of reaching an old schema.
        proxy_pass http://letletme_graphql_active/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # Hermes API Server reverse proxy (added 2026-07-16)
    location = /v1/chat/completions {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8642/v1/chat/completions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location = /v1/models {
        proxy_pass http://127.0.0.1:8642/v1/models;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location = /v1/responses {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8642/v1/responses;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location ~ ^/p/[^/]+/(v1/(?:chat/completions|models|responses))$ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:8642/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
