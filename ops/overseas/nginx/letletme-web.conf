# Public Web origin for EdgeOne's overseas canary and eventual apex route.
# EdgeOne must reach this server with the exact proxy secret and from an ACL
# address rendered in /etc/letletme/edgeone-client-ips.conf.
include /etc/nginx/snippets/letletme-web-origin-auth.conf;

map $http_upgrade $letletme_web_connection {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name letletme.top www.letletme.top eo-overseas-canary.letletme.top;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letletme-acme;
    try_files $uri =404;
  }

  location / {
    return 301 https://letletme.top$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name letletme.top www.letletme.top eo-overseas-canary.letletme.top;

  ssl_certificate /etc/letsencrypt/live/letletme.top/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/letletme.top/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_timeout 1d;

  if ($letletme_web_origin_authorized = 0) {
    return 403;
  }

  client_max_body_size 8m;
  proxy_http_version 1.1;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  proxy_buffering off;
  proxy_set_header Connection $letletme_web_connection;
  proxy_set_header Host letletme.top;
  # The public request is HTTPS, but the standalone Node listener is plain
  # HTTP. Keep the self-hosted Next internal request on the loopback scheme.
  proxy_set_header X-Forwarded-Proto http;
  proxy_set_header X-Forwarded-Host letletme.top;
  proxy_set_header X-Forwarded-Port 443;
  proxy_set_header X-Forwarded-For $letletme_edgeone_client_ip;
  proxy_set_header X-Real-IP $letletme_edgeone_client_ip;
  proxy_set_header CF-Connecting-IP "";
  proxy_set_header X-Vercel-Forwarded-For "";
  proxy_set_header X-Vercel-ID "";
  proxy_set_header X-LetLetMe-Origin-Token "";
  proxy_set_header X-LetLetMe-Client-IP "";
  # Nginx validates the EdgeOne-injected value and then emits the same
  # root-owned application secret expected by the self-hosted Web runtime.
  # Browser-supplied proxy headers are never forwarded.
  proxy_set_header X-LetLetMe-Proxy-Secret $letletme_local_proxy_secret;
  proxy_set_header X-LetLetMe-Proxy-Client-IP $letletme_edgeone_client_ip;

  location / {
    proxy_pass http://letletme_web_active;
  }
}
