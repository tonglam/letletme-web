# Client identity maps are loaded from nginx/letletme-client-ip.conf.
limit_req_zone $letletme_overseas_client_ip zone=hermes_limit:10m rate=10r/s;

server {
	listen 80;
	listen [::]:80;
	server_name hermes.letletme.top;
	client_max_body_size 8m;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		try_files $uri =404;
	}

	# This branch is used only during the short Cloudflare Flexible SSL
	# transition. Normal direct HTTP requests continue to redirect to HTTPS.
	location / {
		if ($letletme_cf_original_https = 0) {
			return 308 https://$host$request_uri;
		}

		proxy_pass http://127.0.0.1:8642;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $letletme_overseas_client_ip;
		proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 10s;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name hermes.letletme.top;

	# The existing certificate is expanded to include hermes.letletme.top
	# before Cloudflare's temporary Flexible SSL rule is removed.
	ssl_certificate /etc/letsencrypt/live/api.letletme.top/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/api.letletme.top/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:letletme_hermes_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 8m;

	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	location = /health {
		proxy_pass http://127.0.0.1:8642;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $letletme_overseas_client_ip;
		proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;
		access_log off;
	}

	location / {
		limit_req zone=hermes_limit burst=20 nodelay;
		proxy_pass http://127.0.0.1:8642;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $letletme_overseas_client_ip;
		proxy_set_header X-Forwarded-For $letletme_overseas_client_ip;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 10s;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}
}
