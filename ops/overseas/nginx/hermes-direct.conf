# Snapshot from Cloudflare's official /client/v4/ips endpoint. Refresh and
# compare this list immediately before the temporary per-host Flexible SSL
# Configuration Rule is enabled.
geo $letletme_cloudflare_source {
	default 0;
	173.245.48.0/20 1;
	103.21.244.0/22 1;
	103.22.200.0/22 1;
	103.31.4.0/22 1;
	141.101.64.0/18 1;
	108.162.192.0/18 1;
	190.93.240.0/20 1;
	188.114.96.0/20 1;
	197.234.240.0/22 1;
	198.41.128.0/17 1;
	162.158.0.0/15 1;
	104.16.0.0/13 1;
	104.24.0.0/14 1;
	172.64.0.0/13 1;
	131.0.72.0/22 1;
	2400:cb00::/32 1;
	2606:4700::/32 1;
	2803:f800::/32 1;
	2405:b500::/32 1;
	2405:8100::/32 1;
	2a06:98c0::/29 1;
	2c0f:f248::/32 1;
}

# Cloudflare keeps the original browser scheme in CF-Visitor even when an
# per-host Configuration Rule temporarily uses Flexible SSL. Both the source
# address and the Cloudflare-generated original-scheme marker must agree, so
# a direct client cannot opt into the clear-text origin path by forging
# headers.
map "$letletme_cloudflare_source:$http_cf_visitor" $letletme_cf_original_https {
	default 0;
	~*^1:.*\"scheme\"[[:space:]]*:[[:space:]]*\"https\" 1;
}

limit_req_zone $binary_remote_addr zone=hermes_limit:10m rate=10r/s;

server {
	listen 80;
	listen [::]:80;
	server_name hermes.letletme.top;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/html;
		try_files $uri =404;
	}

	# This branch is used only during the short Cloudflare Flexible SSL
	# transition. Normal direct HTTP requests continue to redirect to HTTPS.
	location / {
		if ($letletme_cf_original_https = 0) {
			return 308 https://$host$request_uri;
		}

		proxy_pass http://127.0.0.1:8642;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 10s;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name hermes.letletme.top;

	# The existing certificate is expanded to include hermes.letletme.top
	# before Cloudflare's temporary port-80 Origin Rule is removed.
	ssl_certificate /etc/letsencrypt/live/api.letletme.top/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/api.letletme.top/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:letletme_hermes_tls:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	client_max_body_size 8m;

	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	location = /health {
		proxy_pass http://127.0.0.1:8642;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 10s;
		proxy_read_timeout 30s;
		access_log off;
	}

	location / {
		limit_req zone=hermes_limit burst=20 nodelay;
		proxy_pass http://127.0.0.1:8642;
		proxy_http_version 1.1;
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_connect_timeout 10s;
		proxy_read_timeout 600s;
		proxy_send_timeout 600s;
	}
}
