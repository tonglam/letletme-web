# Trust CF-Connecting-IP only when the socket peer is in Cloudflare's current
# official ranges. Direct DNSPod clients use their socket address and cannot
# forge a different rate-limit or forwarding identity.
map "$letletme_cloudflare_source:$http_cf_connecting_ip" $letletme_overseas_client_ip {
	default $remote_addr;
	~^1:(?<letletme_valid_cf_client_ip>[0-9A-Fa-f:.]+)$ $letletme_valid_cf_client_ip;
}

# Cloudflare keeps the original browser scheme in CF-Visitor when a per-host
# Configuration Rule temporarily uses Flexible SSL. Both source and scheme
# must agree before Nginx permits the transitional clear-text origin path.
map "$letletme_cloudflare_source:$http_cf_visitor" $letletme_cf_original_https {
	default 0;
	~*^1:.*\"scheme\"[[:space:]]*:[[:space:]]*\"https\" 1;
}
