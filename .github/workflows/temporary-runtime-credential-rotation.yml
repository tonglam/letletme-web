name: Temporary Runtime Credential Rotation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rotate runtime login passwords
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PREVIOUS_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          WEB_RUNTIME_DB_PASSWORD: ${{ secrets.WEB_RUNTIME_DB_PASSWORD }}
          GRAPHQL_RUNTIME_DB_PASSWORD: ${{ secrets.GRAPHQL_RUNTIME_DB_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import postgres from 'postgres';

          function normalizeUrl(raw) {
            const value = raw.trim();
            const unquoted =
              value.length >= 2 && value[0] === value.at(-1) && ['"', "'"].includes(value[0])
                ? value.slice(1, -1)
                : value;
            const parsed = new URL(unquoted);
            if (!['postgres:', 'postgresql:'].includes(parsed.protocol)) {
              throw new Error('migration URL must use PostgreSQL');
            }
            if (
              parsed.hostname === 'aws-0-ap-southeast-1.pooler.supabase.com' &&
              parsed.username === 'postgres'
            ) {
              parsed.username = 'postgres.gtwcfjoviibmtkevurjw';
            }
            return parsed.toString();
          }

          function quoteIdentifier(value) {
            return `"${value.replaceAll('"', '""')}"`;
          }

          function quoteLiteral(value) {
            return `'${value.replaceAll("'", "''")}'`;
          }

          const candidates = [
            ['canonical', process.env.DATABASE_URL ?? ''],
            ['previous', process.env.PREVIOUS_DATABASE_URL ?? ''],
          ];
          let sql;
          let ownerUrl;
          const failures = [];
          for (const [label, raw] of candidates) {
            if (!raw.trim()) continue;
            let candidateUrl;
            try {
              candidateUrl = normalizeUrl(raw);
              const candidateSql = postgres(candidateUrl, { max: 1, connect_timeout: 5 });
              await candidateSql`select 1`;
              sql = candidateSql;
              ownerUrl = candidateUrl;
              console.log(`accepted migration credential: ${label}`);
              break;
            } catch (error) {
              failures.push(`${label}:${error instanceof Error ? error.message : 'failed'}`);
            }
          }
          if (!sql || !ownerUrl) {
            throw new Error(`no migration credential accepted (${failures.join('; ')})`);
          }

          const roles = await sql`
            select rolname
            from pg_roles
            where rolcanlogin
              and (rolname like 'letletme_web_runtime%'
                or rolname like 'letletme_graphql_runtime%')
            order by rolname
          `;
          const targets = [
            {
              prefix: 'letletme_web_runtime',
              password: process.env.WEB_RUNTIME_DB_PASSWORD ?? '',
            },
            {
              prefix: 'letletme_graphql_runtime',
              password: process.env.GRAPHQL_RUNTIME_DB_PASSWORD ?? '',
            },
          ];
          for (const target of targets) {
            if (!/^[A-Za-z0-9_-]{64}$/.test(target.password)) {
              throw new Error(`${target.prefix} password is not a 64-character secret`);
            }
            const matches = roles.filter(row => row.rolname.startsWith(`${target.prefix}.`) || row.rolname === target.prefix);
            if (matches.length !== 1) {
              throw new Error(`${target.prefix} expected one LOGIN role, found ${matches.length}`);
            }
            const roleName = matches[0].rolname;
            await sql.unsafe(
              `alter role ${quoteIdentifier(roleName)} password ${quoteLiteral(target.password)}`,
            );
            const runtimeUrl = new URL(ownerUrl);
            runtimeUrl.username = roleName;
            runtimeUrl.password = target.password;
            const runtimeSql = postgres(runtimeUrl.toString(), { max: 1, connect_timeout: 5 });
            const check = await runtimeSql`select current_user`;
            await runtimeSql.end();
            if (check[0]?.current_user !== roleName) {
              throw new Error(`${roleName} password verification returned an unexpected role`);
            }
            console.log(`rotated and verified ${roleName}`);
          }
          await sql.end();
          NODE
