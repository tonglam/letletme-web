name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
  DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/testdb
  SCHEMA_EXPORT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/schema_export
  WEB_RUNTIME_DATABASE_URL: postgresql://letletme_web_runtime:wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww@127.0.0.1:5432/testdb
  BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-thirty-two-characters
  BETTER_AUTH_URL: http://localhost:3000
  GRAPHQL_SERVICE_TOKEN: e2e-graphql-service-token-at-least-thirty-two-bytes
  BACKEND_PROXY_SECRET: ci-backend-proxy-secret
  BUG_REPORT_CLEANUP_SECRET: ci-bug-report-cleanup-secret-at-least-thirty-two-bytes

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create Supabase client-role stubs
        run: |
          node --input-type=module <<'EOF'
          import postgres from 'postgres'
          const sql = postgres(process.env.DIRECT_DATABASE_URL, { max: 1 })
          for (const role of ['anon', 'authenticated']) {
            await sql.unsafe(`DO $$ BEGIN CREATE ROLE ${role} NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$`)
          }
          await sql.unsafe(`DO $$ BEGIN
            CREATE ROLE letletme_graphql_reader
              NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
            EXCEPTION WHEN duplicate_object THEN NULL;
          END $$`)
          await sql.end()
          EOF
      - name: Apply migrations and verify repeatability
        run: |
          npm run db:migrate
          npm run db:migrate
          npm run db:migrate:status
      - name: Verify Drizzle declaration parity
        env:
          PGPASSWORD: postgres
          RUN_SCHEMA_DECLARATION_PARITY: 'true'
        run: |
          createdb --host 127.0.0.1 --username postgres schema_export
          psql "$SCHEMA_EXPORT_DATABASE_URL" --set ON_ERROR_STOP=1 --command 'CREATE SCHEMA bauth'
          npx drizzle-kit export --dialect postgresql --schema ./lib/db/schema/auth.ts --sql > /tmp/auth-schema.sql
          psql "$SCHEMA_EXPORT_DATABASE_URL" --set ON_ERROR_STOP=1 --file /tmp/auth-schema.sql
          npx tsx --test test/auth/schema-declaration-parity.integration.test.ts
      - name: Bootstrap and verify production-shaped Web runtime login
        run: |
          npm run db:bootstrap-runtime-login
          password_hash_before="$(psql "$DIRECT_DATABASE_URL" --tuples-only --no-align --command "SELECT rolpassword FROM pg_authid WHERE rolname = 'letletme_web_runtime'")"
          npm run db:bootstrap-runtime-login
          npm run db:verify-runtime-login
          password_hash_after="$(psql "$DIRECT_DATABASE_URL" --tuples-only --no-align --command "SELECT rolpassword FROM pg_authid WHERE rolname = 'letletme_web_runtime'")"
          test -n "$password_hash_before"
          test "$password_hash_before" = "$password_hash_after"
      - name: Verify Web startup contract
        env:
          DATABASE_URL: ${{ env.WEB_RUNTIME_DATABASE_URL }}
        run: npm run db:runtime-contract
      - run: npm test
        env:
          RUN_DB_INTEGRATION: 'true'
      - run: npm run test:edge
      - run: npm run worker:dry-run
      - run: npm run watchdog:dry-run
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Verify operational shell scripts
        run: bash -n ops/tencent/scripts/*.sh ops/redis/scripts/*.sh
      - run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.WEB_RUNTIME_DATABASE_URL }}
          GRAPHQL_ENDPOINT: http://127.0.0.1:4100/graphql
          LETLETME_ORIGIN: tencent
          LETLETME_RELEASE_SHA: ${{ github.sha }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - name: Verify standalone server
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.WEB_RUNTIME_DATABASE_URL }}
          GRAPHQL_ENDPOINT: http://127.0.0.1:4100/graphql
          LETLETME_ORIGIN: tencent
          LETLETME_RELEASE_SHA: ${{ github.sha }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          PORT: '3100'
          HOSTNAME: 127.0.0.1
        run: |
          cp -R public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          node .next/standalone/server.js >/tmp/letletme-standalone.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/healthz >/tmp/letletme-healthz.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status":"ok"' /tmp/letletme-healthz.json
          node -e "const f=require('./.next/required-server-files.json'); if(f.config.deploymentId !== process.env.GITHUB_SHA.slice(0, 32)) process.exit(1)"
          curl --fail --silent --head http://127.0.0.1:3100/healthz | grep -qi '^X-Letletme-Origin: tencent'
          curl --fail --silent --head http://127.0.0.1:3100/healthz | grep -qi "^X-Letletme-Release: $GITHUB_SHA"
      - name: Install Chromium for production E2E
        run: npx playwright install --with-deps chromium
      - name: Production E2E
        run: npm run test:e2e
        env:
          DATABASE_URL: ${{ env.WEB_RUNTIME_DATABASE_URL }}
          PLAYWRIGHT_USE_EXISTING_BUILD: '1'
      - name: Maintenance E2E
        run: npx playwright test e2e/maintenance-mode.spec.ts
        env:
          DATABASE_URL: ${{ env.WEB_RUNTIME_DATABASE_URL }}
          MAINTENANCE_MODE: 'true'
          MAINTENANCE_RETRY_AFTER_SECONDS: '420'
          PLAYWRIGHT_USE_EXISTING_BUILD: '1'
      - run: npm audit --audit-level=moderate
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
