name: Web production release

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact origin/main SHA to release'
        required: true
        type: string
      maintenance_mode:
        description: 'Serve the maintenance surface and keep EdgeOne on all-Vercel'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: letletme-web-production-release
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 52.0.0
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
  # Keep the live price-change channel explicitly controlled by a repository
  # variable.  The safe default remains off until the Data hot watcher has
  # been verified in production.
  WEB_PRICE_CHANGE_LIVE_ENABLED: ${{ vars.LETLETME_PRICE_CHANGE_LIVE_ENABLED || 'false' }}
  WEB_MAINTENANCE_MODE: ${{ inputs.maintenance_mode || false }}

jobs:
  deploy:
    name: Release one exact SHA to Vercel and Tencent
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check release automation gate
        id: automation-gate
        shell: bash
        run: |
          set -euo pipefail
          case "$WEB_MAINTENANCE_MODE" in
            true|false) ;;
            *) echo "invalid maintenance_mode: $WEB_MAINTENANCE_MODE" >&2; exit 1 ;;
          esac
          if [[ "${{ vars.LETLETME_RELEASE_AUTOMATION_ENABLED }}" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Web release automation is disabled until production credentials and EdgeOne snapshots are configured."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release SHA
        if: steps.automation-gate.outputs.enabled == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release is still origin/main
        if: steps.automation-gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "refusing stale release: main=$main_sha requested=$RELEASE_SHA" >&2
            exit 1
          }

      - name: Set up Node.js
        if: steps.automation-gate.outputs.enabled == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install release tooling
        if: steps.automation-gate.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Decide whether this SHA needs a Web release
        if: steps.automation-gate.outputs.enabled == 'true'
        id: build-gate
        shell: bash
        run: |
          set -euo pipefail
          previous_headers=''
          if ! previous_headers="$(curl --fail --silent --show-error --max-time 15 -D - -o /dev/null https://vercel-origin.letletme.top/healthz)"; then
            echo "current production health is unavailable; fail-open to a full Web build" >&2
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous_sha="$(awk 'tolower($1) == "x-letletme-release:" { gsub("\\r", "", $2); print $2; exit }' <<<"$previous_headers")"
          if [[ ! "$previous_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "current production release header is unavailable; fail-open to a full Web build" >&2
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          VERCEL_ENV=production \
          VERCEL_GIT_COMMIT_REF=main \
          VERCEL_GIT_PREVIOUS_SHA="$previous_sha" \
          VERCEL_GIT_COMMIT_SHA="$RELEASE_SHA" \
          node scripts/vercel-ignore-build.mjs
          decision=$?
          set -e
          if [[ $decision -eq 0 ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only SHA; Web release skipped."
          elif [[ $decision -eq 1 ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "ignoreCommand returned unexpected status $decision" >&2
            exit 1
          fi

      - name: Verify production credentials and scoped route snapshots
        if: steps.automation-gate.outputs.enabled == 'true' && steps.build-gate.outputs.deploy == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          TENCENT_SSH_JUMP_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_JUMP_PRIVATE_KEY }}
          TENCENT_SSH_KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
          TENCENT_RELEASE_SIGNING_KEY: ${{ secrets.TENCENT_RELEASE_SIGNING_KEY }}
          EDGEONE_TENCENTCLOUD_SECRET_ID: ${{ secrets.EDGEONE_TENCENTCLOUD_SECRET_ID }}
          EDGEONE_TENCENTCLOUD_SECRET_KEY: ${{ secrets.EDGEONE_TENCENTCLOUD_SECRET_KEY }}
          EDGEONE_PURGE_TENCENTCLOUD_SECRET_ID: ${{ secrets.EDGEONE_PURGE_TENCENTCLOUD_SECRET_ID }}
          EDGEONE_PURGE_TENCENTCLOUD_SECRET_KEY: ${{ secrets.EDGEONE_PURGE_TENCENTCLOUD_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
          EDGEONE_RULE_ID: ${{ secrets.EDGEONE_RULE_ID }}
          EDGEONE_RULE_ALL_VERCEL_JSON: ${{ secrets.EDGEONE_RULE_ALL_VERCEL_JSON }}
          EDGEONE_RULE_SPLIT_JSON: ${{ secrets.EDGEONE_RULE_SPLIT_JSON }}
          EDGEONE_TENCENT_HEALTH_URL: ${{ vars.EDGEONE_TENCENT_HEALTH_URL }}
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID \
            TENCENT_SSH_PRIVATE_KEY TENCENT_SSH_JUMP_PRIVATE_KEY TENCENT_SSH_KNOWN_HOSTS \
            TENCENT_RELEASE_SIGNING_KEY \
            EDGEONE_TENCENTCLOUD_SECRET_ID EDGEONE_TENCENTCLOUD_SECRET_KEY EDGEONE_ZONE_ID \
            EDGEONE_PURGE_TENCENTCLOUD_SECRET_ID EDGEONE_PURGE_TENCENTCLOUD_SECRET_KEY \
            EDGEONE_RULE_ID EDGEONE_RULE_ALL_VERCEL_JSON EDGEONE_RULE_SPLIT_JSON \
            EDGEONE_TENCENT_HEALTH_URL; do
            [[ -n "${!name:-}" ]] || { echo "missing required production secret: $name" >&2; exit 1; }
          done
          export TENCENTCLOUD_SECRET_ID="$EDGEONE_TENCENTCLOUD_SECRET_ID"
          export TENCENTCLOUD_SECRET_KEY="$EDGEONE_TENCENTCLOUD_SECRET_KEY"
          node ops/release/edgeone-mode.mjs --mode all-vercel --dry-run >/dev/null
          node ops/release/edgeone-mode.mjs --mode split --dry-run >/dev/null
          # Create a purge task for a non-existent canary path so invalid or
          # revoked purge credentials fail before any route mutation.
          TENCENTCLOUD_SECRET_ID="$EDGEONE_PURGE_TENCENTCLOUD_SECRET_ID" \
            TENCENTCLOUD_SECRET_KEY="$EDGEONE_PURGE_TENCENTCLOUD_SECRET_KEY" \
            node ops/release/edgeone-purge.mjs \
              --target https://eo-personal-canary.letletme.top/__letletme_purge_authorization_probe__ >/dev/null

      - name: Build remotely and stage Vercel production candidate
        if: steps.automation-gate.outputs.enabled == 'true' && steps.build-gate.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LETLETME_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          VERCEL_GIT_COMMIT_SHA: ${{ env.RELEASE_SHA }}
          VERCEL_GIT_COMMIT_REF: main
          LETLETME_FORCE_VERCEL_BUILD: '1'
        shell: bash
        run: |
          set -euo pipefail
          case "$WEB_PRICE_CHANGE_LIVE_ENABLED" in
            true|false) ;;
            *) echo "invalid LETLETME_PRICE_CHANGE_LIVE_ENABLED value: $WEB_PRICE_CHANGE_LIVE_ENABLED" >&2; exit 1 ;;
          esac
          # Keep sensitive Production variables inside Vercel. A local
          # `vercel build` receives empty placeholders for sensitive values,
          # while a remote Production build receives the real environment.
          npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy \
            --prod \
            --skip-domain \
            --no-wait \
            --force \
            --build-env "LETLETME_RELEASE_SHA=$RELEASE_SHA" \
            --build-env "NEXT_PUBLIC_PRICE_CHANGE_LIVE_ENABLED=$WEB_PRICE_CHANGE_LIVE_ENABLED" \
            --build-env "MAINTENANCE_MODE=$WEB_MAINTENANCE_MODE" \
            --build-env "MAINTENANCE_RETRY_AFTER_SECONDS=420" \
            --env "LETLETME_RELEASE_SHA=$RELEASE_SHA" \
            --env "NEXT_PUBLIC_PRICE_CHANGE_LIVE_ENABLED=$WEB_PRICE_CHANGE_LIVE_ENABLED" \
            --env "MAINTENANCE_MODE=$WEB_MAINTENANCE_MODE" \
            --env "MAINTENANCE_RETRY_AFTER_SECONDS=420" \
            --meta "gitSha=$RELEASE_SHA" \
            --token "$VERCEL_TOKEN" > /tmp/vercel-candidate-url
          candidate_url="$(tr -d '\r\n' < /tmp/vercel-candidate-url)"
          [[ "$candidate_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]
          npx --yes "vercel@${VERCEL_CLI_VERSION}" inspect "$candidate_url" \
            --wait \
            --timeout 10m \
            --format=json \
            --token "$VERCEL_TOKEN" > /tmp/vercel-candidate.json
          CANDIDATE_URL="$candidate_url" node --input-type=module -e '
            import fs from "node:fs";
            const value = JSON.parse(fs.readFileSync("/tmp/vercel-candidate.json", "utf8"));
            const expectedUrl = process.env.CANDIDATE_URL;
            if (value.readyState !== "READY" || value.target !== "production") process.exit(1);
            if (`https://${value.url}` !== expectedUrl) process.exit(1);
          '
          npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /healthz \
            --yes \
            --deployment "$candidate_url" \
            --token "$VERCEL_TOKEN" \
            -- \
            --silent \
            --show-error \
            --dump-header /tmp/vercel-candidate-headers \
            --output /tmp/vercel-candidate-body
          grep -qi "^x-letletme-release: $RELEASE_SHA" /tmp/vercel-candidate-headers
          node --input-type=module -e '
            import fs from "node:fs";
            const value = JSON.parse(fs.readFileSync("/tmp/vercel-candidate-body", "utf8"));
            if (value.status !== "ok" || value.origin !== "vercel") process.exit(1);
            if (value.release !== process.env.RELEASE_SHA) process.exit(1);
          '
          if [[ "$WEB_MAINTENANCE_MODE" == true ]]; then
            npx --yes "vercel@${VERCEL_CLI_VERSION}" curl /api/graphql \
              --yes \
              --deployment "$candidate_url" \
              --token "$VERCEL_TOKEN" \
              -- \
              --silent \
              --show-error \
              --dump-header /tmp/vercel-maintenance-headers \
              --output /tmp/vercel-maintenance-body
            awk 'NR == 1 { gsub("\\r", "", $0); if ($2 != "503") exit 1 }' \
              /tmp/vercel-maintenance-headers
            node --input-type=module -e '
              import fs from "node:fs";
              const value = JSON.parse(fs.readFileSync("/tmp/vercel-maintenance-body", "utf8"));
              if (value.code !== "MAINTENANCE_MODE") process.exit(1);
            '
          fi
          echo "candidate_url=${candidate_url#https://}" >> "$GITHUB_OUTPUT"
        id: vercel-candidate

      - name: Promote and activate exact SHA with fail-closed routing
        if: steps.automation-gate.outputs.enabled == 'true' && steps.build-gate.outputs.deploy == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TENCENT_SSH_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_PRIVATE_KEY }}
          TENCENT_SSH_JUMP_PRIVATE_KEY: ${{ secrets.TENCENT_SSH_JUMP_PRIVATE_KEY }}
          TENCENT_SSH_KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
          TENCENT_RELEASE_SIGNING_KEY: ${{ secrets.TENCENT_RELEASE_SIGNING_KEY }}
          EDGEONE_TENCENTCLOUD_SECRET_ID: ${{ secrets.EDGEONE_TENCENTCLOUD_SECRET_ID }}
          EDGEONE_TENCENTCLOUD_SECRET_KEY: ${{ secrets.EDGEONE_TENCENTCLOUD_SECRET_KEY }}
          EDGEONE_PURGE_TENCENTCLOUD_SECRET_ID: ${{ secrets.EDGEONE_PURGE_TENCENTCLOUD_SECRET_ID }}
          EDGEONE_PURGE_TENCENTCLOUD_SECRET_KEY: ${{ secrets.EDGEONE_PURGE_TENCENTCLOUD_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
          EDGEONE_RULE_ID: ${{ secrets.EDGEONE_RULE_ID }}
          EDGEONE_RULE_ALL_VERCEL_JSON: ${{ secrets.EDGEONE_RULE_ALL_VERCEL_JSON }}
          EDGEONE_RULE_SPLIT_JSON: ${{ secrets.EDGEONE_RULE_SPLIT_JSON }}
          EDGEONE_TENCENT_HEALTH_URL: ${{ vars.EDGEONE_TENCENT_HEALTH_URL }}
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_URL: ${{ steps.vercel-candidate.outputs.candidate_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export TENCENTCLOUD_SECRET_ID="$EDGEONE_TENCENTCLOUD_SECRET_ID"
          export TENCENTCLOUD_SECRET_KEY="$EDGEONE_TENCENTCLOUD_SECRET_KEY"
          route_changed=0
          tencent_activated=0
          rollback_failed=0
          remote_root=''
          remote_archive=''
          remote_signature=''
          ssh_dir=''
          tmp_root=''
          restore_all_vercel() {
            [[ $route_changed == 1 ]] || return 0
            local attempt mutation_succeeded verify_attempt
            for attempt in 1 2 3; do
              mutation_succeeded=0
              if node ops/release/edgeone-mode.mjs --mode all-vercel >/dev/null 2>&1; then
                mutation_succeeded=1
              fi
              for verify_attempt in 1 2 3; do
                if node ops/release/edgeone-mode.mjs --mode all-vercel --verify-only >/dev/null 2>&1; then
                  route_changed=0
                  echo "EdgeOne rollback to all-Vercel verified on attempt $attempt/$verify_attempt."
                  return 0
                fi
                [[ $verify_attempt == 3 ]] || sleep 5
              done
              if [[ $mutation_succeeded == 0 ]]; then
                echo "EdgeOne rollback mutation attempt $attempt failed; live verification did not converge." >&2
              else
                echo "EdgeOne rollback mutation attempt $attempt succeeded but live verification did not converge." >&2
              fi
              [[ $attempt == 3 ]] || sleep $((attempt * 5))
            done
            echo 'CRITICAL: could not verify EdgeOne all-Vercel rollback after 3 attempts.' >&2
            return 1
          }
          cleanup_remote_root() {
            if [[ -n "$remote_root" && -n "$ssh_dir" && -f "$ssh_dir/config" ]]; then
              ssh -F "$ssh_dir/config" letletme-tencent \
                "rm -rf -- '$remote_root' '$remote_archive' '$remote_signature'" || true
            fi
          }
          cleanup_staged_release() {
            if [[ "$tencent_activated" == 0 && -n "$ssh_dir" && -f "$ssh_dir/config" && "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
              ssh -F "$ssh_dir/config" letletme-tencent \
                "sudo /usr/local/libexec/letletme-release cleanup '$RELEASE_SHA'" || true
            fi
          }
          cleanup_on_exit() {
            exit_code=$?
            set +e
            if [[ -n "$tmp_root" ]]; then rm -rf -- "$tmp_root"; fi
            cleanup_staged_release
            cleanup_remote_root
            if ! restore_all_vercel; then
              rollback_failed=1
            fi
            if [[ $rollback_failed == 1 ]]; then
              exit_code=1
            fi
            exit "$exit_code"
          }
          trap cleanup_on_exit EXIT

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "refusing to change EdgeOne routing for stale release: main=$main_sha requested=$RELEASE_SHA" >&2
            exit 1
          }
          route_changed=1
          node ops/release/edgeone-mode.mjs --mode all-vercel >/dev/null

          tmp_root="$(mktemp -d)"
          case "$WEB_PRICE_CHANGE_LIVE_ENABLED" in
            true|false) ;;
            *) echo "invalid LETLETME_PRICE_CHANGE_LIVE_ENABLED value: $WEB_PRICE_CHANGE_LIVE_ENABLED" >&2; exit 1 ;;
          esac
          git archive --format=tar "$RELEASE_SHA" > "$tmp_root/release.tar"
          # The Tencent release tool builds from the signed archive and uses a
          # deliberately narrow host-env allowlist.  Carry the same public
          # feature flag in the signed source so both origins compile the
          # identical client bundle without copying any host secrets.
          printf 'NEXT_PUBLIC_PRICE_CHANGE_LIVE_ENABLED=%s\n' "$WEB_PRICE_CHANGE_LIVE_ENABLED" > "$tmp_root/.env.production"
          chmod 0600 "$tmp_root/.env.production"
          tar --append --file="$tmp_root/release.tar" -C "$tmp_root" .env.production
          printf '%s\n' "$RELEASE_SHA" > "$tmp_root/.letletme-release-sha"
          tar --append --file="$tmp_root/release.tar" -C "$tmp_root" .letletme-release-sha
          gzip -c "$tmp_root/release.tar" > "$tmp_root/release.tar.gz"
          printf '%s\n' "$TENCENT_RELEASE_SIGNING_KEY" > "$tmp_root/release-signing-key.pem"
          chmod 0600 "$tmp_root/release-signing-key.pem"
          openssl pkeyutl -sign -rawin \
            -inkey "$tmp_root/release-signing-key.pem" \
            -in "$tmp_root/release.tar.gz" \
            -out "$tmp_root/release.tar.gz.sig"
          rm -f -- "$tmp_root/release-signing-key.pem"

          ssh_dir="$HOME/.ssh/letletme-release"
          install -d -m 0700 "$ssh_dir"
          printf '%s\n' "$TENCENT_SSH_PRIVATE_KEY" > "$ssh_dir/tencent"
          printf '%s\n' "$TENCENT_SSH_JUMP_PRIVATE_KEY" > "$ssh_dir/jump"
          printf '%s\n' "$TENCENT_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/tencent" "$ssh_dir/jump" "$ssh_dir/known_hosts"
          cat > "$ssh_dir/config" <<EOF
          Host letletme-jump
            HostName 43.163.91.9
            User tong
            IdentityFile $ssh_dir/jump
            StrictHostKeyChecking yes
            UserKnownHostsFile $ssh_dir/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 15
          Host letletme-tencent
            HostName 10.77.0.2
            User deploy
            IdentityFile $ssh_dir/tencent
            ProxyJump letletme-jump
            StrictHostKeyChecking yes
            UserKnownHostsFile $ssh_dir/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
            ConnectTimeout 15
          EOF
          chmod 0600 "$ssh_dir/config"

          installed_tooling="$(ssh -F "$ssh_dir/config" letletme-tencent \
            "sudo /usr/local/libexec/letletme-release version")"
          [[ "$installed_tooling" == "letletme-release-tooling 20260826-2" ]] || {
            echo "Tencent release tooling is stale: $installed_tooling" >&2
            echo "Rerun ops/tencent/scripts/install-host.sh as root before enabling Web automation." >&2
            exit 1
          }
          current_release="$(ssh -F "$ssh_dir/config" letletme-tencent \
            "sudo /usr/local/libexec/letletme-release current")"

          remote_root="/tmp/letletme-release-$RELEASE_SHA"
          remote_archive="/tmp/letletme-release-$RELEASE_SHA.tar.gz"
          remote_signature="/tmp/letletme-release-$RELEASE_SHA.sig"
          ssh -F "$ssh_dir/config" letletme-tencent \
            "rm -rf -- '$remote_root' '$remote_archive' '$remote_signature' && install -d -m 0750 '$remote_root'"
          cat "$tmp_root/release.tar.gz" |
            ssh -F "$ssh_dir/config" letletme-tencent "install -m 0640 /dev/stdin '$remote_archive'"
          cat "$tmp_root/release.tar.gz.sig" |
            ssh -F "$ssh_dir/config" letletme-tencent "install -m 0640 /dev/stdin '$remote_signature'"
          ssh -F "$ssh_dir/config" letletme-tencent \
            "tar -xzf '$remote_archive' -C '$remote_root'"
          if [[ "$current_release" == "/opt/letletme/releases/$RELEASE_SHA" ]]; then
            echo "Tencent release $RELEASE_SHA is already active; retrying idempotently."
          else
            ssh -F "$ssh_dir/config" letletme-tencent \
              "sudo /usr/local/libexec/letletme-release stage '$remote_root' '$RELEASE_SHA'"
          fi
          ssh -F "$ssh_dir/config" letletme-tencent \
            "sudo /usr/local/libexec/letletme-release verify '$RELEASE_SHA'"

          npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$CANDIDATE_URL" \
            --yes \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN"
          production_ready=0
          for attempt in $(seq 1 12); do
            production_headers=''
            if production_headers="$(curl --fail --silent --show-error --max-time 5 \
              -D - -o /dev/null https://vercel-origin.letletme.top/healthz)" && \
              grep -qi "^x-letletme-release: $RELEASE_SHA" <<<"$production_headers"; then
              production_ready=1
              break
            fi
            echo "Waiting for the promoted Vercel alias to serve $RELEASE_SHA (attempt $attempt/12)."
            [[ $attempt -eq 12 ]] || sleep 5
          done
          [[ $production_ready == 1 ]] || {
            echo "promoted Vercel alias did not converge to $RELEASE_SHA" >&2
            exit 1
          }

          if [[ "$WEB_MAINTENANCE_MODE" == true ]]; then
            # The maintenance dispatch is the traffic barrier for the hard
            # cutover.  Keep the public route on the verified Vercel
            # maintenance candidate and do not activate/split Tencent until
            # the final non-maintenance Web release is ready.
            route_changed=0
            cleanup_remote_root
            echo "Vercel maintenance barrier is active at exact SHA $RELEASE_SHA; EdgeOne remains all-Vercel."
            exit 0
          fi

          ssh -F "$ssh_dir/config" letletme-tencent \
            "sudo /usr/local/libexec/letletme-release activate '$RELEASE_SHA'"
          tencent_activated=1
          ssh -F "$ssh_dir/config" letletme-tencent \
            "curl --fail --silent --show-error --max-time 10 -D - -o /dev/null http://127.0.0.1:3000/healthz" |
            grep -qi "^x-letletme-release: $RELEASE_SHA"

          node ops/release/edgeone-mode.mjs --mode split >/dev/null
          tencent_headers="$(curl --fail --silent --show-error --max-time 15 \
            -D - -o /dev/null "$EDGEONE_TENCENT_HEALTH_URL")"
          grep -qi '^x-letletme-origin: tencent' <<<"$tencent_headers"
          grep -qi "^x-letletme-release: $RELEASE_SHA" <<<"$tencent_headers"
          grep -qi '^x-letletme-edge: edgeone' <<<"$tencent_headers"

          # Immutable objects can retain headers from a previous release even
          # after the source is fixed. Delete only the managed Next static
          # prefixes after both origins and the split route are healthy. The
          # trap above restores all-Vercel routing if the purge is rejected.
          TENCENTCLOUD_SECRET_ID="$EDGEONE_PURGE_TENCENTCLOUD_SECRET_ID" \
            TENCENTCLOUD_SECRET_KEY="$EDGEONE_PURGE_TENCENTCLOUD_SECRET_KEY" \
            node ops/release/edgeone-purge.mjs
          route_changed=0
          cleanup_remote_root
          echo "Vercel and Tencent are active at exact SHA $RELEASE_SHA; EdgeOne split routing restored."

      - name: Print skipped documentation release
        if: steps.automation-gate.outputs.enabled == 'true' && steps.build-gate.outputs.deploy == 'false'
        run: echo "Documentation-only change; no Vercel or Tencent release was attempted."
