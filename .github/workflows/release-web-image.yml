name: Web overseas OCI image

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact origin/main SHA to publish'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: letletme-web-overseas-image
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
  IMAGE_NAME: ghcr.io/tonglam/letletme-web
  LIVE_REFRESH_PROFILE: ${{ vars.LETLETME_LIVE_REFRESH_PROFILE || 'conserve' }}
  VERCEL_CLI_VERSION: 52.0.0

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release is still origin/main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "refusing stale image release: main=$main_sha requested=$RELEASE_SHA" >&2
            exit 1
          }
          case "$LIVE_REFRESH_PROFILE" in
            normal|conserve|manual) ;;
            *) echo "invalid LETLETME_LIVE_REFRESH_PROFILE value: $LIVE_REFRESH_PROFILE" >&2; exit 1 ;;
          esac

      - name: Pull the minimal Vercel Production build environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [[ -n "${!name:-}" ]] || { echo "missing required production secret: $name" >&2; exit 1; }
          done
          source_env="$(mktemp /tmp/letletme-vercel-production-env.XXXXXX)"
          build_env="/tmp/letletme-web-build-env"
          mkdir -p .vercel
          python3 - "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json <<'PY'
          import json
          import sys

          print(json.dumps({"orgId": sys.argv[1], "projectId": sys.argv[2]}))
          PY
          chmod 0600 .vercel/project.json
          chmod 0600 "$source_env"
          chmod 0600 "$build_env" 2>/dev/null || true
          npx --yes "vercel@${VERCEL_CLI_VERSION}" env pull "$source_env" \
            --environment=production \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" >/dev/null
          python3 - "$source_env" "$build_env" "$LIVE_REFRESH_PROFILE" <<'PY'
          import pathlib
          import shlex
          import sys

          source_path = pathlib.Path(sys.argv[1])
          output_path = pathlib.Path(sys.argv[2])
          live_profile = sys.argv[3]
          wanted = {
              "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY",
              "NEXT_PUBLIC_APP_URL",
              "NEXT_PUBLIC_SUPABASE_URL",
              "NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE",
          }
          values = {}
          for raw_line in source_path.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              key, separator, raw_value = line.partition("=")
              if separator and key in wanted:
                  parsed = shlex.split(raw_value, comments=False)
                  values[key] = parsed[0] if parsed else ""
          missing = sorted(key for key in wanted if not values.get(key))
          if missing:
              raise SystemExit("Vercel Production is missing build inputs: " + ",".join(missing))
          values["NEXT_PUBLIC_LIVE_REFRESH_PROFILE"] = live_profile
          values["NEXT_PUBLIC_PRICE_CHANGE_LIVE_ENABLED"] = "false"
          output_path.write_text(
              "".join(f"{key}={shlex.quote(value)}\n" for key, value in sorted(values.items())),
              encoding="utf-8",
          )
          output_path.chmod(0o600)
          PY
          rm -f -- "$source_env"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Web image
        env:
          DOCKER_BUILDKIT: '1'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --build-arg "RELEASE_SHA=$RELEASE_SHA" \
            --secret "id=web_build_env,src=/tmp/letletme-web-build-env" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag "$IMAGE_NAME:$RELEASE_SHA" \
            --push \
            .
          image_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_SHA" | awk '/^Digest:/ { print $2; exit }')"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Published $IMAGE_NAME@$image_digest for $RELEASE_SHA"
          {
            echo "image_ref=$IMAGE_NAME@$image_digest"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
