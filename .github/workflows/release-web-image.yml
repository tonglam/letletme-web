name: Web overseas OCI image

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact origin/main SHA to publish'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: letletme-web-overseas-image
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
  IMAGE_NAME: ghcr.io/tonglam/letletme-web
  LIVE_REFRESH_PROFILE: ${{ vars.LETLETME_LIVE_REFRESH_PROFILE || 'conserve' }}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release is still origin/main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$RELEASE_SHA" ]] || {
            echo "refusing stale image release: main=$main_sha requested=$RELEASE_SHA" >&2
            exit 1
          }
          case "$LIVE_REFRESH_PROFILE" in
            normal|conserve|manual) ;;
            *) echo "invalid LETLETME_LIVE_REFRESH_PROFILE value: $LIVE_REFRESH_PROFILE" >&2; exit 1 ;;
          esac

      - name: Prepare the minimal production build environment
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          build_env="/tmp/letletme-web-build-env"
          rm -f -- "$build_env"
          python3 - "$build_env" "$LIVE_REFRESH_PROFILE" <<'PY'
          import base64
          import os
          import pathlib
          import shlex
          import sys

          output_path = pathlib.Path(sys.argv[1])
          live_profile = sys.argv[2]
          encryption_key = os.environ.get("NEXT_SERVER_ACTIONS_ENCRYPTION_KEY", "")
          if not encryption_key:
              raise SystemExit("GitHub Production is missing NEXT_SERVER_ACTIONS_ENCRYPTION_KEY")
          if len(encryption_key) != 44:
              raise SystemExit("NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must be 32-byte base64")
          try:
              decoded_key = base64.b64decode(encryption_key, validate=True)
          except Exception as exc:
              raise SystemExit("NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must be valid base64") from exc
          if len(decoded_key) != 32:
              raise SystemExit("NEXT_SERVER_ACTIONS_ENCRYPTION_KEY must decode to 32 bytes")
          values = {
              "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY": encryption_key,
              "NEXT_PUBLIC_APP_URL": "https://letletme.top",
              "NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE": "0.25",
          }
          values["NEXT_PUBLIC_LIVE_REFRESH_PROFILE"] = live_profile
          values["NEXT_PUBLIC_PRICE_CHANGE_LIVE_ENABLED"] = "false"
          output_path.write_text(
              "".join(f"{key}={shlex.quote(value)}\n" for key, value in sorted(values.items())),
              encoding="utf-8",
          )
          output_path.chmod(0o600)
          PY
          chmod 0600 "$build_env"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@18ce135bb5112fa8ce4ed6c17ab05699d7f3a5e0 # v3.11.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable Web image
        env:
          DOCKER_BUILDKIT: '1'
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { rm -f -- /tmp/letletme-web-build-env; }
          trap cleanup EXIT
          docker buildx build \
            --file Dockerfile \
            --platform linux/amd64 \
            --build-arg "RELEASE_SHA=$RELEASE_SHA" \
            --secret "id=web_build_env,src=/tmp/letletme-web-build-env" \
            --label "org.opencontainers.image.revision=$RELEASE_SHA" \
            --tag "$IMAGE_NAME:$RELEASE_SHA" \
            --push \
            .
          image_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_SHA" | awk '/^Digest:/ { print $2; exit }')"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "Published $IMAGE_NAME@$image_digest for $RELEASE_SHA"
          {
            echo "image_ref=$IMAGE_NAME@$image_digest"
            echo "release_sha=$RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
