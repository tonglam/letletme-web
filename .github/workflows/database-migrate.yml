name: Database Migrate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-database-migrate
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pending migrations
        env:
          DIRECT_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          npm run db:migrate
          npm run db:migrate:status
      - name: Verify runtime login without mutating credentials
        env:
          DIRECT_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: npm run db:verify-runtime-login
