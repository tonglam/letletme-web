name: EdgeOne origin ACL query

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    name: Query current EdgeOne origin ranges
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the current production source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Query and validate the current ACL
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.EDGEONE_TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.EDGEONE_TENCENTCLOUD_SECRET_KEY }}
          EDGEONE_ZONE_ID: ${{ secrets.EDGEONE_ZONE_ID }}
        run: node ops/release/edgeone-origin-acl.mjs > edgeone-origin-acl.json

      - name: Upload the validated ACL evidence
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-origin-acl-${{ github.run_id }}
          path: edgeone-origin-acl.json
          retention-days: 7
