name: V3 Production Cutover

on:
  # repository_dispatch always resolves this workflow and GITHUB_SHA from the
  # default branch, so an unreviewed branch cannot redefine secret-bearing jobs.
  repository_dispatch:
    types:
      - v3-web-production-cutover

permissions:
  contents: read

concurrency:
  group: v3-production-cutover
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event.client_payload.operation == 'v3-preflight'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Web candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - name: Require exact protected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          echo "V3_WEB_TRUSTED_MAIN_SHA=$main_sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect exact Web migration state without writes
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          set +e
          output=$(npm run db:migrate:status 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '^(backdated|mismatch|orphan|missing) '; then
            echo "::error::Web migration history is unsafe"
            exit 1
          fi
          pending_count=$(printf '%s\n' "$output" | grep -Ec '^pending ' || true)
          if [ "$pending_count" -eq 0 ] && [ "$status" -eq 0 ]; then
            echo "V3_WEB_PREFLIGHT_MIGRATIONS=already-applied"
          elif [ "$pending_count" -eq 1 ] \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0009_graphql_auth_reader' \
            && [ "$status" -eq 1 ]; then
            echo "V3_WEB_PREFLIGHT_MIGRATIONS=0009-deferred"
          elif [ "$pending_count" -eq 2 ] \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0008_web_auth_runtime_role' \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0009_graphql_auth_reader' \
            && [ "$status" -eq 1 ]; then
            echo "V3_WEB_PREFLIGHT_MIGRATIONS=0008-pending,0009-deferred"
          else
            echo "::error::Unexpected Web migration status (exit=$status pending=$pending_count)"
            exit 1
          fi
      - name: Inspect Data activation and Web role state without writes
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
        run: |
          node --input-type=module <<'EOF'
          import postgres from 'postgres'
          const sql = postgres(process.env.DIRECT_DATABASE_URL, { max: 1, prepare: false })
          const [state] = await sql`
            SELECT
              current_setting('server_version_num')::integer AS server_version_num,
              current_user::text AS migration_role,
              to_regclass('ops.migration_runs') IS NOT NULL AS has_data_ledger,
              EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'letletme_web_auth') AS has_capability,
              EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'letletme_web_runtime') AS has_login
          `
          let runStatus = 'not-available'
          if (state.has_data_ledger && process.env.CUTOVER_RUN_ID) {
            const rows = await sql`
              SELECT status, metadata ? 'legacyDropPhase' AS cleanup_started
              FROM ops.migration_runs
              WHERE run_id = ${process.env.CUTOVER_RUN_ID}
            `
            runStatus = rows.length === 1
              ? `${rows[0].status}:${rows[0].cleanup_started ? 'cleanup' : 'pre-cleanup'}`
              : 'missing'
          }
          console.log(JSON.stringify({
            serverMajor: Math.floor(Number(state.server_version_num) / 10000),
            migrationRolePresent: Boolean(state.migration_role),
            hasDataLedger: state.has_data_ledger,
            runStatus,
            hasWebCapability: state.has_capability,
            hasWebLogin: state.has_login,
          }))
          await sql.end()
          EOF

  activate_database:
    if: github.event.client_payload.operation == 'v3-activate-database'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Web candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - name: Require exact protected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          echo "V3_WEB_TRUSTED_MAIN_SHA=$main_sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve and gate exact Web release
        env:
          V3_CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          V3_RELEASE_MANIFEST_BASE64: ${{ github.event.client_payload.v3_release_manifest_base64 }}
          V3_RELEASE_MANIFEST_SHA256: ${{ github.event.client_payload.v3_release_manifest_sha256 }}
          V3_CUTOVER_APPROVAL: ${{ github.event.client_payload.v3_cutover_approval }}
        run: |
          set -euo pipefail
          DEPLOY_SHA=$(git rev-parse HEAD)
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          export DEPLOY_SHA

          # R3 revises only the Data release candidate while Web remains on
          # component contract 3.2.5. Verify the exact approved R3 bytes first,
          # then normalize only that release suffix for the frozen Web gate.
          manifest_tmp=$(mktemp)
          normalized_tmp=$(mktemp)
          trap 'rm -f "$manifest_tmp" "$normalized_tmp"' EXIT
          printf '%s' "$V3_RELEASE_MANIFEST_BASE64" | base64 --decode > "$manifest_tmp"
          actual_manifest_sha=$(sha256sum "$manifest_tmp" | awk '{print $1}')
          test "$actual_manifest_sha" = "$V3_RELEASE_MANIFEST_SHA256"
          plan_version=$(jq -r '.planVersion // empty' "$manifest_tmp")
          if [ "$plan_version" = '3.2.5-r3' ]; then
            jq '.planVersion = "3.2.5"' "$manifest_tmp" > "$normalized_tmp"
            V3_RELEASE_MANIFEST_BASE64=$(base64 < "$normalized_tmp" | tr -d '\n')
            V3_RELEASE_MANIFEST_SHA256=$(sha256sum "$normalized_tmp" | awk '{print $1}')
            export V3_RELEASE_MANIFEST_BASE64 V3_RELEASE_MANIFEST_SHA256
            echo 'V3_WEB_RELEASE_PLAN=3.2.5-r3-normalized-to-3.2.5'
          elif [ "$plan_version" != '3.2.5' ]; then
            echo "::error::Unsupported Web release plan version"
            exit 1
          fi
          npx tsx scripts/v3-release-gate.ts
      - name: Reconfirm exact Web migration state without writes
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          set +e
          output=$(npm run db:migrate:status 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '^(backdated|mismatch|orphan|missing) '; then
            echo "::error::Web migration history changed to an unsafe state"
            exit 1
          fi
          pending_count=$(printf '%s\n' "$output" | grep -Ec '^pending ' || true)
          if [ "$pending_count" -eq 0 ] && [ "$status" -eq 0 ]; then
            echo "V3_WEB_ACTIVATION_MIGRATIONS=already-applied"
          elif [ "$pending_count" -eq 1 ] \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0009_graphql_auth_reader' \
            && [ "$status" -eq 1 ]; then
            echo "V3_WEB_ACTIVATION_MIGRATIONS=0009-deferred"
          elif [ "$pending_count" -eq 2 ] \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0008_web_auth_runtime_role' \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0009_graphql_auth_reader' \
            && [ "$status" -eq 1 ]; then
            echo "V3_WEB_ACTIVATION_MIGRATIONS=0008-pending,0009-deferred"
          else
            echo "::error::Unexpected Web migration status before activation (exit=$status pending=$pending_count)"
            exit 1
          fi
      - name: Apply exact Web migration and provision runtime login
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          V3_CUTOVER_APPROVAL: ${{ github.event.client_payload.v3_cutover_approval }}
          V3_WEB_DB_PASSWORD: ${{ secrets.V3_WEB_DB_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          [[ "$V3_WEB_DB_PASSWORD" =~ ^[A-Za-z0-9_-]{64}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          npm run db:migrate:activation
          set +e
          output=$(npm run db:migrate:status 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          pending_count=$(printf '%s\n' "$output" | grep -Ec '^pending ' || true)
          if [ "$pending_count" -eq 0 ] && [ "$status" -eq 0 ]; then
            echo 'V3_WEB_ACTIVATION_RESULT=all-migrations-already-applied'
          elif [ "$pending_count" -eq 1 ] \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0009_graphql_auth_reader' \
            && [ "$status" -eq 1 ]; then
            echo 'V3_WEB_ACTIVATION_RESULT=0008-applied,0009-deferred'
          else
            echo "::error::Activation migration did not stop at 0008 (exit=$status pending=$pending_count)"
            exit 1
          fi
          npm run db:provision-runtime-login
          npm run db:provision-runtime-login
      - name: Build runtime URL without exposing credentials
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          V3_WEB_DB_PASSWORD: ${{ secrets.V3_WEB_DB_PASSWORD }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs'
          const url = new URL(process.env.DIRECT_DATABASE_URL)
          const match = /^postgres\.([a-z0-9]{8,64})$/.exec(decodeURIComponent(url.username))
          if (!match || !/^[A-Za-z0-9_-]{64}$/.test(process.env.V3_WEB_DB_PASSWORD ?? '')) {
            throw new Error('Migration URL or Web runtime password is invalid')
          }
          url.username = `letletme_web_runtime.${match[1]}`
          url.password = process.env.V3_WEB_DB_PASSWORD
          url.port = '6543'
          const runtimeUrl = url.toString()
          console.log(`::add-mask::${runtimeUrl}`)
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${runtimeUrl}\n`)
          EOF
      - name: Verify the live Web runtime boundary
        run: npm run db:runtime-contract

  post_activation_migrate:
    if: github.event.client_payload.operation == 'v3-migrate-database'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Web candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - name: Require exact protected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          echo "V3_WEB_MIGRATION_TRUSTED_MAIN_SHA=$main_sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gate the exact post-activation migration
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          CUTOVER_RUN_ID: ${{ github.event.client_payload.v3_cutover_run_id }}
          V3_CUTOVER_APPROVAL: ${{ github.event.client_payload.v3_cutover_approval }}
        run: |
          set -euo pipefail
          [[ "$CUTOVER_RUN_ID" =~ ^v3-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{7,12}$ ]]
          test "$V3_CUTOVER_APPROVAL" = "APPROVE_V3_ACTIVATION $CUTOVER_RUN_ID"

          set +e
          output=$(npm run db:migrate:status 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '^(backdated|mismatch|orphan|missing) '; then
            echo "::error::Web migration history is unsafe"
            exit 1
          fi
          pending_count=$(printf '%s\n' "$output" | grep -Ec '^pending ' || true)
          if [ "$pending_count" -eq 0 ] && [ "$status" -eq 0 ]; then
            echo 'V3_WEB_POST_ACTIVATION_MIGRATION=already-applied'
          elif [ "$pending_count" -eq 1 ] \
            && printf '%s\n' "$output" | grep -Fxq 'pending 0009_graphql_auth_reader' \
            && [ "$status" -eq 1 ]; then
            echo 'V3_WEB_POST_ACTIVATION_MIGRATION=0009-pending'
          else
            echo "::error::Unexpected post-activation migration state (exit=$status pending=$pending_count)"
            exit 1
          fi

          node --input-type=module <<'EOF'
          import postgres from 'postgres'
          const sql = postgres(process.env.DIRECT_DATABASE_URL, { max: 1, prepare: false })
          const rows = await sql`
            SELECT status
            FROM ops.migration_runs
            WHERE run_id = ${process.env.CUTOVER_RUN_ID}
          `
          if (rows.length !== 1 || rows[0].status !== 'activated') {
            throw new Error('Data Platform v3 activation is not authoritative')
          }
          await sql.end()
          EOF
      - name: Apply and verify the exact Web migration
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          npm run db:migrate
          npm run db:migrate:status
      - name: Verify the GraphQL auth-reader boundary
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
        run: |
          node --input-type=module <<'EOF'
          import postgres from 'postgres'
          const sql = postgres(process.env.DIRECT_DATABASE_URL, { max: 1, prepare: false })
          const [role] = await sql`
            SELECT
              rolcanlogin,
              rolsuper,
              rolcreatedb,
              rolcreaterole,
              rolinherit,
              rolreplication,
              rolbypassrls
            FROM pg_roles
            WHERE rolname = 'letletme_graphql_reader'
          `
          if (!role || Object.values(role).some(Boolean)) {
            throw new Error('GraphQL auth capability role is missing or unsafe')
          }

          const [boundary] = await sql`
            SELECT
              has_schema_privilege('letletme_graphql_reader', 'bauth', 'USAGE') AS can_use,
              has_schema_privilege('letletme_graphql_reader', 'bauth', 'CREATE') AS can_create
          `
          if (!boundary.can_use || boundary.can_create) {
            throw new Error('GraphQL auth-reader allowlist is incomplete or unsafe')
          }

          const tablePrivileges = await sql`
            SELECT relation.relname AS table_name
            FROM pg_class relation
            JOIN pg_namespace namespace_row ON namespace_row.oid = relation.relnamespace
            WHERE namespace_row.nspname = 'bauth'
              AND relation.relkind IN ('r', 'p')
              AND (
                has_table_privilege('letletme_graphql_reader', relation.oid, 'SELECT')
                OR has_table_privilege('letletme_graphql_reader', relation.oid, 'INSERT')
                OR has_table_privilege('letletme_graphql_reader', relation.oid, 'UPDATE')
                OR has_table_privilege('letletme_graphql_reader', relation.oid, 'DELETE')
                OR has_table_privilege('letletme_graphql_reader', relation.oid, 'TRUNCATE')
                OR has_table_privilege('letletme_graphql_reader', relation.oid, 'REFERENCES')
                OR has_table_privilege('letletme_graphql_reader', relation.oid, 'TRIGGER')
              )
          `
          if (tablePrivileges.length > 0) {
            throw new Error('GraphQL auth reader has table-level bauth privileges')
          }

          const columnPrivileges = await sql`
            SELECT
              relation.relname AS table_name,
              attribute.attname AS column_name,
              has_column_privilege(
                'letletme_graphql_reader', relation.oid, attribute.attnum, 'SELECT'
              ) AS can_select,
              (
                has_column_privilege(
                  'letletme_graphql_reader', relation.oid, attribute.attnum, 'INSERT'
                )
                OR has_column_privilege(
                  'letletme_graphql_reader', relation.oid, attribute.attnum, 'UPDATE'
                )
                OR has_column_privilege(
                  'letletme_graphql_reader', relation.oid, attribute.attnum, 'REFERENCES'
                )
              ) AS can_write
            FROM pg_attribute attribute
            JOIN pg_class relation ON relation.oid = attribute.attrelid
            JOIN pg_namespace namespace_row ON namespace_row.oid = relation.relnamespace
            WHERE namespace_row.nspname = 'bauth'
              AND relation.relkind IN ('r', 'p')
              AND attribute.attnum > 0
              AND NOT attribute.attisdropped
              AND (
                has_column_privilege(
                  'letletme_graphql_reader', relation.oid, attribute.attnum, 'SELECT'
                )
                OR has_column_privilege(
                  'letletme_graphql_reader', relation.oid, attribute.attnum, 'INSERT'
                )
                OR has_column_privilege(
                  'letletme_graphql_reader', relation.oid, attribute.attnum, 'UPDATE'
                )
                OR has_column_privilege(
                  'letletme_graphql_reader', relation.oid, attribute.attnum, 'REFERENCES'
                )
              )
            ORDER BY relation.relname, attribute.attnum
          `
          const expectedColumns = new Set([
            'mini_program_session.expires_at',
            'mini_program_session.revoked_at',
            'mini_program_session.token_hash',
            'mini_program_session.user_id',
            'user.fpl_entry_id',
            'user.fpl_entry_verified_at',
            'user.id',
          ])
          const actualColumns = new Set(
            columnPrivileges.map(row => `${row.table_name}.${row.column_name}`)
          )
          const validColumns = columnPrivileges.length === expectedColumns.size
            && columnPrivileges.every(row =>
              row.can_select
              && !row.can_write
              && expectedColumns.has(`${row.table_name}.${row.column_name}`)
            )
            && [...expectedColumns].every(column => actualColumns.has(column))
          if (!validColumns) {
            throw new Error('GraphQL auth reader column allowlist is incomplete or unsafe')
          }

          const policies = await sql`
            SELECT tablename, roles::text[] AS roles, cmd, qual, with_check
            FROM pg_policies
            WHERE schemaname = 'bauth'
              AND policyname = 'graphql_auth_reader_select'
            ORDER BY tablename
          `
          const expectedTables = ['mini_program_session', 'user']
          const validPolicies = policies.length === 2 && policies.every((policy, index) =>
            policy.tablename === expectedTables[index]
            && policy.cmd === 'SELECT'
            && policy.roles.length === 1
            && policy.roles[0] === 'letletme_graphql_reader'
            && policy.qual?.replace(/[()\s]/g, '') === 'true'
            && policy.with_check === null
          )
          if (!validPolicies) throw new Error('GraphQL auth-reader RLS policies are invalid')
          console.log(JSON.stringify({
            graphqlAuthReaderTables: expectedTables,
            graphqlAuthReaderColumns: [...expectedColumns].sort(),
            tablePrivileges: 0,
            writePrivileges: 0,
          }))
          await sql.end()
          EOF
      - name: Build runtime URL without exposing credentials
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          V3_WEB_DB_PASSWORD: ${{ secrets.V3_WEB_DB_PASSWORD }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs'
          const url = new URL(process.env.DIRECT_DATABASE_URL)
          const match = /^postgres\.([a-z0-9]{8,64})$/.exec(decodeURIComponent(url.username))
          if (!match || !/^[A-Za-z0-9_-]{64}$/.test(process.env.V3_WEB_DB_PASSWORD ?? '')) {
            throw new Error('Migration URL or Web runtime password is invalid')
          }
          url.username = `letletme_web_runtime.${match[1]}`
          url.password = process.env.V3_WEB_DB_PASSWORD
          url.port = '6543'
          const runtimeUrl = url.toString()
          console.log(`::add-mask::${runtimeUrl}`)
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${runtimeUrl}\n`)
          EOF
      - name: Verify the live Web runtime boundary
        run: npm run db:runtime-contract

  status:
    if: github.event.client_payload.operation == 'v3-status'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Web candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false
      - name: Require exact protected main commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_SHA" = "$main_sha"
          test "$(git rev-parse HEAD)" = "$main_sha"
          echo "V3_WEB_TRUSTED_MAIN_SHA=$main_sha"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify migrations are complete
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
        run: npm run db:migrate:status
      - name: Build runtime URL without exposing credentials
        env:
          DIRECT_DATABASE_URL: ${{ secrets.V3_MIGRATION_DATABASE_URL }}
          V3_WEB_DB_PASSWORD: ${{ secrets.V3_WEB_DB_PASSWORD }}
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync } from 'node:fs'
          const url = new URL(process.env.DIRECT_DATABASE_URL)
          const match = /^postgres\.([a-z0-9]{8,64})$/.exec(decodeURIComponent(url.username))
          if (!match || !/^[A-Za-z0-9_-]{64}$/.test(process.env.V3_WEB_DB_PASSWORD ?? '')) {
            throw new Error('Migration URL or Web runtime password is invalid')
          }
          url.username = `letletme_web_runtime.${match[1]}`
          url.password = process.env.V3_WEB_DB_PASSWORD
          url.port = '6543'
          const runtimeUrl = url.toString()
          console.log(`::add-mask::${runtimeUrl}`)
          appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${runtimeUrl}\n`)
          EOF
      - name: Verify the live Web runtime boundary
        run: npm run db:runtime-contract
